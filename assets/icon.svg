<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- aqua → blue "peek / water" accent -->
    <linearGradient id="bg" x1="160" y1="120" x2="880" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#2C8CF5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="panel" x1="430" y1="250" x2="430" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C8CF5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <!-- macOS squircle: icon art lives inside this rounded square with margin -->
    <clipPath id="squircle">
      <rect x="100" y="90" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- background -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="90" width="824" height="824" fill="url(#bg)"/>

    <!-- back card, faintly stacked behind the peeking panel -->
    <rect x="360" y="300" width="700" height="420" rx="80" ry="80" fill="#FFFFFF" opacity="0.16"/>

    <!-- the slide-over panel, peeking from the right edge -->
    <rect x="430" y="250" width="700" height="520" rx="80" ry="80" fill="url(#panel)"/>

    <!-- icon rail (the AppRail) -->
    <circle cx="500" cy="380" r="26" fill="url(#dot)"/>
    <circle cx="500" cy="510" r="26" fill="url(#dot)"/>
    <circle cx="500" cy="640" r="26" fill="#2563EB" opacity="0.28"/>
  </g>

  <!-- hairline rim for crispness on light backgrounds -->
  <rect x="100.5" y="90.5" width="823" height="823" rx="184.5" ry="184.5" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/>
</svg>
