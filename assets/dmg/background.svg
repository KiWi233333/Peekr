<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- one quiet blue-tinted wash, near white -->
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF5FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#field)"/>

  <!-- Hand-drawn drag arrow: one relaxed gesture with rounded, open chevrons.
       Slightly asymmetric curves keep it human without making the line wavy.
       Centred on y=212, the row Finder drops the two icons on. -->
  <g fill="none" stroke="#2563EB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 219 C274 204 294 207 311 212 C323 216 334 214 342 208"/>
    <path d="M330 199 C334 202 338 205 342 208 C338 211 334 215 331 220"/>
  </g>
</svg>
