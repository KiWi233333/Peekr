name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 (Xcode 26) compiles the real Liquid Glass path; macos-15
        # (Xcode 16) proves the project still builds with the material fallback
        # on the older SDK. Drop a row if a runner image isn't available to you.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ matrix.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ matrix.os }}-spm-

      - name: Build
        run: swift build -v
