name: Release

# Triggered by pushing a semver tag, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
# Tag the commit on `main` you want to ship.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & package
    # Needs Xcode 26 for Liquid Glass (the `Glass` type lives only in the
    # macOS 26 SDK); older runners fail to compile.
    runs-on: macos-26
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dmg: ${{ steps.meta.outputs.dmg }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=Peekr-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # Basic CI gate — fail the release if it doesn't compile.
      - name: Build (release)
        run: swift build -c release -v

      # Import a Developer ID cert IF one is configured as a repo secret; otherwise
      # the release stays ad-hoc & un-notarized — i.e. exactly today's behavior.
      # Fully gated on the secret being present.
      - name: Set up signing identity
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12:-}" ]; then
            echo "No MACOS_CERTIFICATE_P12 secret — release stays ad-hoc & un-notarized (current behavior)."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/peekr-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${MACOS_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Keep the temp keychain searchable alongside the runner defaults.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # `|| true`: grep exits 1 when the cert isn't a Developer ID Application
          # one (e.g. an Apple Development cert); under `pipefail` that would abort
          # the whole step instead of falling through to the ad-hoc path.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -oE '"Developer ID Application[^"]*"' | head -1 | tr -d '"' || true)"
          echo "Signing identity: ${IDENTITY:-<none found in cert>}"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      # Assemble the .app bundle. PEEKR_HARDENED takes effect only when an identity
      # was imported above; with none, bundle.sh falls back to ad-hoc (PEEKR_HARDENED
      # is ignored), so the no-secret path is unchanged.
      - name: Bundle .app
        env:
          PEEKR_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          PEEKR_HARDENED: "1"
        run: ./scripts/bundle.sh release

      # Notarize + staple the .app BEFORE it is frozen into the DMG/zip, so EVERY
      # distributed copy (drag-installed from the DMG and unzipped) carries an
      # embedded ticket and validates under OFFLINE Gatekeeper. (Stapling only the
      # standalone build/Peekr.app after the DMG is built leaves the DMG's inner
      # copy un-stapled.) Gated on BOTH notary creds AND a signing identity: a bare
      # ad-hoc app can't be notarized, so without an identity this stays a clean
      # no-op (ad-hoc/un-notarized — current behavior) instead of failing the
      # submission.
      - name: Notarize & staple .app
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          if [ -z "${AC_API_KEY_BASE64:-}" ] || [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "No notary credentials or no signing identity — app stays ad-hoc & un-notarized (current behavior)."
            exit 0
          fi
          printf '%s' "$AC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"
          trap 'rm -f "$RUNNER_TEMP/ac_api_key.p8"' EXIT
          export AC_API_KEY_PATH="$RUNNER_TEMP/ac_api_key.p8"
          ./scripts/notarize.sh build/Peekr.app

      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          # build/Peekr.app is already stapled above (when credentials are present),
          # so both the DMG's inner copy and the standalone zip inherit the ticket.
          cp -R build/Peekr.app dist/stage/
          ln -s /Applications dist/stage/Applications
          hdiutil create -volname "Peekr" \
            -srcfolder dist/stage \
            -ov -format UDZO \
            "dist/${{ steps.meta.outputs.dmg }}"
          # also ship a plain zip of the .app
          ditto -c -k --keepParent build/Peekr.app "dist/Peekr-${{ steps.meta.outputs.version }}.app.zip"
          ls -la dist

      # Notarize + staple the DMG container itself, so the .dmg also passes offline
      # Gatekeeper on mount. The .app inside it was already stapled above. Same
      # gating; a clean no-op without credentials/identity.
      - name: Notarize & staple DMG
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          if [ -z "${AC_API_KEY_BASE64:-}" ] || [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "No notary credentials or no signing identity — DMG stays ad-hoc & un-notarized (current behavior)."
            exit 0
          fi
          printf '%s' "$AC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"
          trap 'rm -f "$RUNNER_TEMP/ac_api_key.p8"' EXIT
          export AC_API_KEY_PATH="$RUNNER_TEMP/ac_api_key.p8"
          ./scripts/notarize.sh "dist/${{ steps.meta.outputs.dmg }}"

      # Upload only the real outputs. `dist/stage/` holds an `Applications`
      # symlink to /Applications (for the DMG drag-install affordance), and
      # upload-artifact follows symlinks — `dist/*` would walk it and try to
      # upload the runner's entire /Applications (Xcode included), hanging the job.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peekr-${{ steps.meta.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.app.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Peekr ${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/${{ steps.meta.outputs.dmg }}
            dist/Peekr-${{ steps.meta.outputs.version }}.app.zip

  # Optional Lark / Feishu notification.
  # Configure repo secrets to enable (the job is a no-op when LARK_WEBHOOK_URL is unset):
  #   LARK_WEBHOOK_URL     — required. Your custom-bot webhook URL.
  #   LARK_WEBHOOK_SECRET  — optional. Set only if the bot has "signature verification" on.
  notify:
    name: Notify Lark
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Lark card
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
          STATUS: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${LARK_WEBHOOK_URL:-}" ]; then
            echo "LARK_WEBHOOK_URL not set — skipping notification."
            exit 0
          fi

          if [ "$STATUS" = "success" ]; then
            HEADER="🚀 Peekr $VERSION released"; COLOR="green"
          else
            HEADER="❌ Peekr $VERSION release failed"; COLOR="red"
          fi

          # Optional signed-request fields (only when the bot enforces a signature).
          SIGN_FIELDS=""
          if [ -n "${LARK_WEBHOOK_SECRET:-}" ]; then
            TIMESTAMP="$(date +%s)"
            # Lark's algorithm: HMAC-SHA256 over empty data, using
            # (timestamp + "\n" + secret) as the KEY; then base64.
            SIGN="$(printf '' | openssl dgst -sha256 \
              -hmac "$(printf '%s\n%s' "$TIMESTAMP" "$LARK_WEBHOOK_SECRET")" \
              -binary | base64)"
            SIGN_FIELDS="\"timestamp\":\"$TIMESTAMP\",\"sign\":\"$SIGN\","
          fi

          PAYLOAD=$(cat <<JSON
          {
            ${SIGN_FIELDS}
            "msg_type": "interactive",
            "card": {
              "config": { "wide_screen_mode": true },
              "header": {
                "template": "$COLOR",
                "title": { "tag": "plain_text", "content": "$HEADER" }
              },
              "elements": [
                { "tag": "div", "text": {
                    "tag": "lark_md",
                    "content": "**Repo:** $REPO\n**Status:** $STATUS" } },
                { "tag": "action", "actions": [
                    { "tag": "button", "text": { "tag": "plain_text", "content": "Release" },
                      "type": "primary", "url": "$RELEASE_URL" },
                    { "tag": "button", "text": { "tag": "plain_text", "content": "Workflow run" },
                      "type": "default", "url": "$RUN_URL" }
                ] }
              ]
            }
          }
          JSON
          )

          curl -sS -X POST "$LARK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" | tee /tmp/lark_resp.json
          echo
          # Lark returns {"code":0,...} on success.
          grep -q '"code":0\|"StatusCode":0' /tmp/lark_resp.json || {
            echo "::warning::Lark webhook responded with a non-zero code"; }
